[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "antennadesk"
dynamic = ["version"]
description = "Antenna design, simulation, and construction for amateur radio."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Fernando Sclavo" }]
keywords = ["amateur-radio", "antenna", "nec2", "electromagnetics"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: Telecommunications Industry",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "pydantic>=2.7,<3",
  # PySide6 6.12 triggered a shutdown refcount crash with pyqtgraph.
  "pyside6-essentials>=6.9.2,<6.10",
  "pyqtgraph>=0.13,<1",
  "ezdxf>=1.4,<2",
]

[project.gui-scripts]
antennadesk = "antennadesk.ui.app:main"

[dependency-groups]
packaging = [
  # PyInstaller is GPL-2.0-or-later with the bootloader exception; it is used
  # only to build the desktop bundles and is not a runtime dependency.
  "pyinstaller>=6.10,<7",
]
dev = [
  "hypothesis>=6.170,<7",
  "mypy>=1.10",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-qt>=4.4",
  "ruff>=0.5",
]

[tool.hatch.version]
path = "src/antennadesk/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/antennadesk"]

[tool.hatch.build.targets.sdist]
include = ["src/antennadesk", "tests", "docs", "packaging", "README.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["antennadesk"]

[tool.ruff.lint.per-file-ignores]
# The parser fixture reproduces fixed-width nec2c output.
"tests/unit/simulation/test_parser.py" = ["E501"]
# Translation tables and HTML templates naturally contain long strings.
"src/antennadesk/ui/i18n.py" = ["E501"]
"src/antennadesk/reporting/html_report.py" = ["E501"]
"src/antennadesk/reporting/construction_sheet.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/antennadesk"]
exclude = ["^tests/", "^src/antennadesk/ui/"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "science: numerical reference or physical-invariant test",
  "solver: requires a real nec2c executable",
  "slow: takes more than a few seconds",
  "golden: compares against a committed golden file",
  "ui: Qt widget test",
]

[tool.coverage.run]
branch = true
source = ["antennadesk"]

[tool.coverage.report]
show_missing = true
skip_covered = true
