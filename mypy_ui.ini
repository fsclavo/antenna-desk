# Permissive mypy pass for the Qt layer.
#
# The strict `mypy` run covers every package except `antennadesk.ui`. This
# second pass type-checks the UI with untyped defs allowed, so the Qt layer is
# not invisible to the type checker.
#
# The `exclude` list was a ratchet: files with existing errors stayed out
# until they were fixed, and new UI files were checked by default. It is now
# empty: every UI file is checked. Do not add an entry to hide a regression.

[mypy]
python_version = 3.11
files = src/antennadesk/ui
ignore_missing_imports = True
check_untyped_defs = True
follow_imports = silent
warn_unused_ignores = False
warn_redundant_casts = False
warn_unreachable = False
