# Permissive mypy pass for the Qt layer.
#
# The strict `mypy` run covers every package except `antennadesk.ui`. This
# second pass type-checks the UI with untyped defs allowed, so the Qt layer is
# not invisible to the type checker.
#
# The `exclude` list is a ratchet: files with existing errors stay out until
# they are fixed, and new UI files are checked by default. Remove entries as
# they reach zero errors; never add one to hide a regression.

[mypy]
python_version = 3.11
files = src/antennadesk/ui
ignore_missing_imports = True
check_untyped_defs = True
follow_imports = silent
warn_unused_ignores = False
warn_redundant_casts = False
warn_unreachable = False
exclude = (?x)(
    ^src/antennadesk/ui/main_window\.py$
    | ^src/antennadesk/ui/wizard/dipole_wizard\.py$
    | ^src/antennadesk/ui/widgets/dipole_form\.py$
    | ^src/antennadesk/ui/widgets/results_view\.py$
    | ^src/antennadesk/ui/dialogs/comparison_dialog\.py$
    | ^src/antennadesk/ui/geometry/builder\.py$
    | ^src/antennadesk/ui/geometry/dxf_export\.py$
    | ^src/antennadesk/ui/widgets/radiation_pattern_3d_view\.py$
    | ^src/antennadesk/ui/geometry/views\.py$
    | ^src/antennadesk/ui/dialogs/matching_network_dialog\.py$
    | ^src/antennadesk/ui/dialogs/element_optimization_dialog\.py$
    | ^src/antennadesk/ui/widgets/fan_dipole_form\.py$
    | ^src/antennadesk/ui/widgets/chart_cursor\.py$
    | ^src/antennadesk/ui/dialogs/synthesis_dialog\.py$
    | ^src/antennadesk/ui/dialogs/ocfd_dialog\.py$
    | ^src/antennadesk/ui/dialogs/endfed_dialog\.py$
    | ^src/antennadesk/ui/dialogs/custom_antenna_dialog\.py$
  )
