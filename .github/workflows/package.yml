name: Package

on:
  push:
    paths:
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - "README.md"
      - "LICENSE"
      - ".github/workflows/package.yml"
  pull_request:
    paths:
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - "README.md"
      - "LICENSE"
      - ".github/workflows/package.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build wheel and sdist
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Sync locked environment
        run: uv sync --locked --python 3.12

      - name: Build artifacts
        run: uv build --out-dir dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: antennadesk-dist
          path: dist/

  smoke:
    name: Install wheel and import
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: antennadesk-dist
          path: dist

      - name: Install wheel
        run: python -m pip install dist/*.whl

      - name: Import package and check version
        run: |
          python -c "import antennadesk; print(antennadesk.__version__)"
          python -m antennadesk.ui.app --version
          python -c "from antennadesk.domain.design import estimate_intent"
