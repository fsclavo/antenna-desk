name: Package

on:
  push:
    paths:
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - "README.md"
      - "LICENSE"
      - ".github/workflows/package.yml"
  pull_request:
    paths:
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - "README.md"
      - "LICENSE"
      - ".github/workflows/package.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build wheel and sdist
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          prune-cache: true

      - name: Sync locked environment
        run: uv sync --locked --python 3.12

      - name: Build artifacts
        run: uv build --out-dir dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: antennadesk-dist
          path: dist/

  smoke:
    name: Install wheel and import
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 \
            libxcb-randr0 libxcb-render-util0 libxcb-xfixes0 libdbus-1-3 \
            libfontconfig1 libglib2.0-0

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: antennadesk-dist
          path: dist

      - name: Install wheel
        run: python -m pip install dist/*.whl

      - name: Import package and check version
        run: |
          python -c "import antennadesk; print(antennadesk.__version__)"
          python -m antennadesk.ui.app --version
          python -c "from antennadesk.domain.design import estimate_intent"
