name: Mutation

on:
  schedule:
    # Weekly, Monday 04:00 UTC. Mutation testing is too slow for every PR.
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    name: Mutation (Linux, mutmut)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          prune-cache: true

      - name: Sync locked environment
        run: uv sync --locked --python 3.12

      # Report-only for now. The raw score is dominated by message-only
      # equivalent mutants in DesignIntent.__post_init__; raise a threshold
      # once the mutation operators are narrowed or the messages are asserted.
      - name: Run mutation testing
        continue-on-error: true
        run: uv run mutmut run --max-children 4

      - name: Collect results
        if: always()
        run: uv run mutmut results > mutation-results.txt || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mutation-results
          path: mutation-results.txt
