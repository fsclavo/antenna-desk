name: Mutation

on:
  schedule:
    # Weekly, Monday 04:00 UTC. Mutation testing is too slow for every PR.
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    name: Mutation (Linux, mutmut)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          prune-cache: true

      - name: Sync locked environment
        run: uv sync --locked --python 3.12

      # Report-only for now. The raw score is dominated by message-only
      # equivalent mutants in DesignIntent.__post_init__; raise a threshold
      # once the mutation operators are narrowed or the messages are asserted.
      - name: Run mutation testing
        run: uv run mutmut run --max-children 4

      - name: Collect results
        if: always()
        run: uv run mutmut results > mutation-results.txt || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-results
          path: mutation-results.txt
