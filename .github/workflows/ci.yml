name: CI

on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "benchmarks/**"
      - "examples/**"
      - "spikes/phase0/**"
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/**"
      - "packaging/**"
      - ".github/workflows/ci.yml"
      - "README.md"
      - "CHANGELOG.md"
      - "AGENTS.md"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "benchmarks/**"
      - "examples/**"
      - "spikes/phase0/**"
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/**"
      - "packaging/**"
      - ".github/workflows/ci.yml"
      - "README.md"
      - "CHANGELOG.md"
      - "AGENTS.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (Linux, Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          prune-cache: true

      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-randr0 libxcb-render-util0 libxcb-xfixes0 libdbus-1-3 libfontconfig1 libglib2.0-0

      - name: Sync locked environment
        run: uv sync --locked --python 3.12

      - name: Verify the lockfile
        run: uv lock --check

      - name: Audit dependencies
        run: uv run --with pip-audit pip-audit --skip-editable

      - name: Ruff
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy

      - name: mypy (UI, permissive ratchet)
        run: uv run mypy --config-file mypy_ui.ini

      - name: Fast tests
        run: uv run pytest -m "fast and not slow" -q

      - name: pytest
        shell: bash
        run: |
          timeout 180s uv run pytest tests/ui/test_results_view.py -q
          timeout 180s uv run pytest tests/ui/test_main_window_*.py -q
          timeout 180s uv run pytest tests/ui --ignore=tests/ui/test_results_view.py --ignore-glob='*test_main_window_*.py' -q
          timeout 300s uv run pytest tests/acceptance tests/integration tests/unit -q

  benchmark:
    name: Benchmarks (report only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          prune-cache: true

      - name: Sync locked environment
        run: uv sync --locked --python 3.12

      - name: Run benchmarks
        run: uv run pytest benchmarks --benchmark-only -p no:pytest-qt --benchmark-json=benchmark.json -q

      - name: Upload benchmark results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: benchmark
          path: benchmark.json

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          prune-cache: true

      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-randr0 libxcb-render-util0 libxcb-xfixes0 libdbus-1-3 libfontconfig1 libglib2.0-0

      - name: Sync locked environment
        run: uv sync --locked --python ${{ matrix.python-version }}

      # PySide6 6.9.3/Qt can abort or hang when the complete UI suite runs in
      # one process. Run the heavy UI files in separate processes on every
      # platform, then the rest of the UI and non-UI suites.
      - name: pytest
        shell: bash
        run: |
          uv run pytest tests/ui/test_results_view.py -q
          timeout 120s uv run pytest tests/ui/test_main_window_*.py -vv
          uv run pytest tests/ui --ignore=tests/ui/test_results_view.py --ignore-glob='*test_main_window_*.py' -q
          uv run pytest tests/acceptance tests/integration tests/unit -q

  solver-linux:
    name: Solver integration (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          prune-cache: true

      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-randr0 libxcb-render-util0 libxcb-xfixes0 libdbus-1-3 libfontconfig1 libglib2.0-0

      - name: Build nec2c
        run: bash spikes/phase0/scripts/build_nec2c.sh

      - name: Sync locked environment
        run: uv sync --locked --python 3.12

      - name: Solver integration tests
        env:
          NEC2C: ${{ github.workspace }}/spikes/phase0/build/nec2c
        run: uv run pytest tests/integration/simulation -q

  solver-windows:
    name: Solver integration (Windows)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          prune-cache: true

      - name: Set up MSYS2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc make patch

      - name: Build nec2c for Windows
        shell: msys2 {0}
        env:
          CC: gcc
        run: bash spikes/phase0/scripts/build_nec2c_windows.sh

      - name: Sync locked environment
        run: uv sync --locked --python 3.12

      - name: Solver integration tests
        env:
          NEC2C: ${{ github.workspace }}/spikes/phase0/build/nec2c.exe
        run: uv run pytest tests/integration/simulation -q

  coverage:
    name: Coverage (Linux, with solver)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          prune-cache: true

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-randr0 libxcb-render-util0 libxcb-xfixes0 libdbus-1-3 libfontconfig1 libglib2.0-0

      - name: Build nec2c
        run: bash spikes/phase0/scripts/build_nec2c.sh

      - name: Sync locked environment
        run: uv sync --locked --python 3.12

      - name: Full suite with coverage
        env:
          NEC2C: ${{ github.workspace }}/spikes/phase0/build/nec2c
        run: |
          uv run pytest -q \
            --cov=antennadesk --cov-branch \
            --cov-report=term-missing --cov-report=xml

      # Thresholds are one point below the measured baseline and ratchet up.
      - name: Coverage gate
        run: |
          uv run coverage report --format=total --fail-under=84
          uv run coverage report --format=total --include='src/antennadesk/domain/*' --fail-under=90
          uv run coverage report --format=total --include='src/antennadesk/simulation/*' --fail-under=90
          uv run coverage report --format=total --include='src/antennadesk/persistence/*' --fail-under=93
          uv run coverage report --format=total --include='src/antennadesk/application/*' --fail-under=91
          uv run coverage report --format=total --include='src/antennadesk/importers/*' --fail-under=88
          uv run coverage report --format=total --include='src/antennadesk/reporting/*' --fail-under=86
          uv run coverage report --format=total --include='src/antennadesk/ui/*' --fail-under=81

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage
          path: coverage.xml

  cross-engine:
    name: Cross-engine (Linux, nec2++)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          prune-cache: true

      # pytest-qt is installed with the dev group and configures Qt at session
      # start, even when this test does not use it.
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-randr0 libxcb-render-util0 libxcb-xfixes0 libdbus-1-3 libfontconfig1 libglib2.0-0

      - name: Build nec2c
        run: bash spikes/phase0/scripts/build_nec2c.sh

      # PyNEC is optional so the Windows and macOS matrix never builds it.
      - name: Sync locked environment with the cross-engine group
        run: uv sync --locked --python 3.12 --group cross-engine

      - name: Cross-engine tests
        env:
          NEC2C: ${{ github.workspace }}/spikes/phase0/build/nec2c
        run: |
          uv run --group cross-engine pytest \
            tests/integration/simulation/test_necpp_cross_engine.py -q
