version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python:
        patterns: ["*"]
    ignore:
      # 6.12.0 triggers a shutdown refcount crash with pyqtgraph. Block only
      # that minor; newer versions are proposed and tested before merging.
      - dependency-name: "pyside6-essentials"
        versions: ["6.12.*"]
