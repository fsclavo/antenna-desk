version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python:
        patterns: ["*"]
        exclude-patterns: ["pyside6-essentials"]
      pyside6:
        patterns: ["pyside6-essentials"]
    ignore:
      # PySide6 is deliberately pinned below 6.12: 6.12 triggered a shutdown
      # refcount crash with pyqtgraph. Qt minor upgrades need a separate,
      # deliberate evaluation, so they are not mixed with routine updates.
      - dependency-name: "pyside6-essentials"
        versions: ["6.12.*"]
