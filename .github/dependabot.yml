version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python:
        patterns: ["*"]
    ignore:
      # 6.10+ is excluded: 6.12 triggers a shutdown refcount crash with
      # pyqtgraph. Patches inside the pinned range are still proposed.
      - dependency-name: "pyside6-essentials"
        versions: [">= 6.10"]
